[Settings]
; Master toggle for HideBikeHelmet mod
Enabled=true

; Default helmet state: true = start WITHOUT helmet (game will NOT force helmets on bikes)
DefaultWithoutHelmet=true

; Hotkey to toggle helmet switch ON / OFF on demand (e.g. K, H, J, O, F10, None)
ToggleHelmetKey=K

; Optional hotkey modifier (e.g. None, Shift, Control, Alt)
; If set to None, pressing Shift+K or Ctrl+K will not accidentally trigger the hotkey
ToggleHelmetModifier=None

; Show on-screen subtitle notification when toggling helmet switch ("Helmet: ON" / "Helmet: OFF")
ShowNotification=true

; Automatically cycle to the next helmet variant/texture each time the helmet switch is turned ON
CycleVariantsOnToggle=true

; Keep the realistic helmet removal animation when stepping off a bike or taking helmet off on foot
PlayRemoveAnimation=true

; Prevent the helmet from dropping on the ground (deletes the helmet prop the instant it is removed)
PreventGroundDrop=true

[Controller]
; Enable gamepad / controller support
EnableController=true

; Controller control to toggle helmet (default: Phone = D-Pad Up)
ControllerToggleControl=Phone

; Hold duration in milliseconds required to toggle helmet via controller (default: 400ms)
; Quick tap opens the phone/navigates up normally; holding for 400ms toggles helmet ON / OFF
ControllerHoldTimeMs=400

[Performance]
; Throttling interval in milliseconds during the helmet drop interception window (default: 50ms)
CleanupIntervalMs=50

; Detection radius around player in meters for helmet cleanup (default: 2.5)
DropDetectionRadius=2.5

[CustomHelmets]
; Comma-separated list of additional prop model names or numeric hashes for custom DLC/add-on helmets
; Example: Models=prop_custom_helmet_01, prop_custom_helmet_02
Models=
